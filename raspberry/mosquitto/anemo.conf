# /etc/mosquitto/conf.d/anemo.conf
# Broker MQTT de Anemo en la Raspberry Pi

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/anemo.acl

# Guarda mensajes retenidos y sesiones QoS 1 entre reinicios
persistence true
persistence_location /var/lib/mosquitto/

log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true
